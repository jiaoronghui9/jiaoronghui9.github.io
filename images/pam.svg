<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6f9"/>
      <stop offset="1" stop-color="#d5e9f0"/>
    </linearGradient>
    <radialGradient id="p" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#b8dbe7" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- powder particle field -->
  <g fill="#0e4d64" opacity="0.18">
    <circle cx="120" cy="90" r="10"/><circle cx="210" cy="150" r="6"/><circle cx="80" cy="210" r="8"/>
    <circle cx="180" cy="280" r="12"/><circle cx="110" cy="360" r="7"/><circle cx="250" cy="400" r="9"/>
    <circle cx="650" cy="110" r="8"/><circle cx="720" cy="200" r="11"/><circle cx="670" cy="310" r="6"/>
    <circle cx="600" cy="400" r="9"/><circle cx="730" cy="420" r="7"/><circle cx="520" cy="80" r="5"/>
  </g>
  <!-- powder heap -->
  <path d="M250 380 Q400 240 550 380 Z" fill="url(#p)" stroke="#8fc3d6" stroke-width="2"/>
  <path d="M300 380 Q400 300 500 380 Z" fill="#ffffff" opacity="0.8"/>
  <!-- scoop -->
  <rect x="560" y="300" width="120" height="8" rx="4" fill="#0e4d64" opacity="0.7"/>
  <path d="M560 308 L600 330 L680 308 Z" fill="#00b4d8" opacity="0.35"/>
  <!-- water drops -->
  <path d="M400 110 c-14 22 -22 32 -22 44 a22 22 0 0 0 44 0 c0 -12 -8 -22 -22 -44z" fill="#00b4d8" opacity="0.55"/>
  <path d="M330 160 c-9 14 -14 20 -14 28 a14 14 0 0 0 28 0 c0 -8 -5 -14 -14 -28z" fill="#00b4d8" opacity="0.4"/>
  <path d="M470 160 c-9 14 -14 20 -14 28 a14 14 0 0 0 28 0 c0 -8 -5 -14 -14 -28z" fill="#00b4d8" opacity="0.4"/>
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0e4d64" text-anchor="middle" letter-spacing="6">POLYACRYLAMIDE</text>
</svg>
